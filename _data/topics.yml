- slug: kata
  name: Kata
  category: Training methodology
  summary: >
    Kata are formalized sequences used to preserve techniques, timing, movement principles, and tactical concepts within many martial arts.
  functions:
    - Technical preservation
    - Solo training
    - Rhythm and coordination
    - Historical transmission
  associated_arts:
    - Karate
    - Taekwondo
    - Aikido
  historical_context: >
    Kata became especially important in systems where structured transmission and pedagogy were central to preserving techniques across generations.

- slug: kuzushi
  name: Kuzushi
  category: Grappling principle
  summary: >
    Kuzushi refers to breaking an opponent's balance before executing a throw or takedown.
  functions:
    - Throw preparation
    - Balance manipulation
    - Timing control
  associated_arts:
    - Judo
    - Aikido
    - Jujutsu
  historical_context: >
    Kuzushi became foundational within Japanese grappling systems because leverage and timing often proved more effective than strength alone.

- slug: belt-ranking-systems
  name: Belt Ranking Systems
  category: Organizational structure
  summary: >
    Belt ranking systems are used by many martial arts to structure progression, teaching, and evaluation.
  functions:
    - Student progression
    - Instructional hierarchy
    - Curriculum organization
  associated_arts:
    - Judo
    - Karate
    - Taekwondo
    - Brazilian Jiu-Jitsu
  historical_context: >
    Colored ranking systems became widely associated with Judo and later spread to many other martial arts worldwide.
