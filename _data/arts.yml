  global_presence: Brazilian Jiu-Jitsu is practiced globally and has become a major foundation for mixed martial arts, self-defense instruction, and submission grappling competition.
  historical_notes: Challenge matches, vale tudo events, and early mixed martial arts competitions were central to BJJ’s international visibility. Sport BJJ later developed its own complex competitive ecosystem.
