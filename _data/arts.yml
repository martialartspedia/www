- slug: karate
  name: Karate
  type: Striking martial art
  origin: Okinawa, Japan
  period: Formalized during the late 19th and early 20th centuries
  classification: Traditional martial art and modern combat sport
  primary_range: Striking
  major_focus:
    - Punching
    - Kicking
    - Kata
    - Blocking
    - Timing
    - Discipline
  summary: >
    Karate developed from Okinawan fighting systems influenced by local combat practices and Chinese martial traditions.
    It was later introduced to mainland Japan and diversified into multiple schools and competitive systems.
  technical_characteristics:
    - Linear striking techniques
    - Formalized kata
    - Structured rank systems
    - Emphasis on posture and distance management
  notable_styles:
    - Shotokan
    - Goju-ryu
    - Shito-ryu
    - Wado-ryu
    - Kyokushin
  governing_bodies:
    - World Karate Federation
    - Japan Karate Association
  notable_people:
    - Gichin Funakoshi
    - Chojun Miyagi
    - Mas Oyama
  terminology:
    - Kata
    - Kumite
    - Dojo
    - Gi
    - Sensei
  global_presence: >
    Karate is practiced globally in traditional, educational, recreational, and competitive contexts.
    It became an Olympic sport for the Tokyo 2020 Games.
  historical_notes: >
    Okinawan karate evolved during periods where weapon restrictions encouraged development of empty-hand systems.
    Later transmission to mainland Japan led to institutionalization in schools and universities.
  related_topics:
    - Kata
    - Belt ranking systems
    - Olympic martial arts

- slug: judo
  name: Judo
  type: Grappling martial art and Olympic sport
  origin: Japan
  period: Founded in 1882
  classification: Modern Japanese budo and Olympic combat sport
  primary_range: Clinch and grappling
  major_focus:
    - Throws
    - Balance breaking
    - Pins
    - Submissions
    - Physical education
  summary: >
    Judo was founded by Jigoro Kano from earlier jujutsu traditions.
    It emphasizes efficient movement, leverage, safe training methods, and structured free practice.
  technical_characteristics:
    - Throwing mechanics
    - Kuzushi principles
    - Randori training
    - Structured pedagogy
  notable_styles:
    - Kodokan Judo
    - Kosen Judo
  governing_bodies:
    - International Judo Federation
    - Kodokan
  notable_people:
    - Jigoro Kano
    - Kyuzo Mifune
    - Yasuhiro Yamashita
  terminology:
    - Kuzushi
    - Randori
    - Ne-waza
    - Tachi-waza
  global_presence: >
    Judo is practiced worldwide and is one of the most internationally organized martial arts.
    It became an Olympic sport in 1964.
  historical_notes: >
    Kano modernized older jujutsu systems into a safer educational model.
    Judo later influenced many modern grappling systems worldwide.
  related_topics:
    - Kuzushi
    - Randori
    - Olympic martial arts

