- slug: japan
  name: Japan
  martial_overview: >
    Japan is one of the most influential centers of modern martial arts development.
    It produced globally recognized systems such as Judo, Aikido, Kendo, and several major karate traditions.
  historical_factors:
    - Samurai military traditions
    - Meiji-era modernization
    - Educational institutionalization
    - Olympic sport development
  notable_arts:
    - Judo
    - Karate
    - Aikido
    - Kendo
    - Jujutsu
  organizational_characteristics:
    - Structured rank systems
    - Dojo culture
    - National federations
    - International governing bodies
  modern_impact: >
    Japanese martial arts heavily influenced global martial arts education, sport organization, ranking systems, and training terminology.

