- slug: gichin-funakoshi
  name: Gichin Funakoshi
  lifespan: 1868–1957
  nationality: Japanese
  associated_art: Karate
  role: Educator and martial arts instructor
  known_for:
    - Introducing karate to mainland Japan
    - Foundational influence on Shotokan karate
    - Karate pedagogy
  biography: >
    Gichin Funakoshi is widely regarded as one of the most influential figures in modern karate history.
    He helped systematize Okinawan karate for educational institutions and university clubs in Japan.
  historical_significance: >
    Funakoshi's efforts transformed karate from a regional Okinawan practice into an internationally recognized martial art.
  organizations:
    - Shotokan karate organizations
  publications:
    - Karate-Do: My Way of Life
  influence:
    - University karate clubs
    - Modern karate curriculum
    - International karate expansion

- slug: jigoro-kano
  name: Jigoro Kano
  lifespan: 1860–1938
  nationality: Japanese
  associated_art: Judo
  role: Founder of Judo
  known_for:
    - Kodokan Judo
    - Educational philosophy
    - Modernization of jujutsu
  biography: >
    Jigoro Kano founded Judo in 1882 and integrated martial training with physical education and moral development.
  historical_significance: >
    Kano established one of the first globally organized martial arts systems and helped position Judo as an international sport.
  organizations:
    - Kodokan
    - International Olympic movement
  publications:
    - Educational writings on Judo
  influence:
    - Olympic combat sports
    - Modern martial arts pedagogy
    - Grappling systems worldwide

