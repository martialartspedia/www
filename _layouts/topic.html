---
layout: default
---
<article class="record-page card">
  <p class="eyebrow">Topic Profile</p>
  <h1>{{ page.title }}</h1>
  <p class="lede">{{ page.summary }}</p>

  <section class="fact-grid compact">
    <div><span>Category</span><strong>{{ page.category }}</strong></div>
  </section>

  <section>
    <h2>Appears In</h2>
    <div class="pill-row">
      {% for item in page.appears_in %}<span>{{ item }}</span>{% endfor %}
    </div>
  </section>

  {{ content }}
</article>
