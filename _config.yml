title: MartialArtsPedia
description: A structured reference site for martial arts knowledge, history, systems, people, and traditions.
url: "https://martialartspedia.com"
baseurl: ""
timezone: America/Toronto

collections:
  arts:
    output: true
    permalink: /arts/:name/
  people:
    output: true
    permalink: /people/:name/
  topics:
    output: true
    permalink: /topics/:name/
  regions:
    output: true
    permalink: /regions/:name/

defaults:
  - scope:
      path: ""
      type: arts
    values:
      layout: art
  - scope:
      path: ""
      type: people
    values:
      layout: person
  - scope:
      path: ""
      type: topics
    values:
      layout: topic
  - scope:
      path: ""
      type: regions
    values:
      layout: region

markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-sitemap
